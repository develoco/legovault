services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      DOMAIN: "https://toximaxi.duckdns.org"
      SIGNUPS_ALLOWED: false
    volumes:
      - ./vw-data:/data

  caddy:
    build: .
    container_name: caddy
    restart: always
    ports:
      - 4443:443
    environment:
      DOMAIN: "https://toximaxi.duckdns.org"
      EMAIL: "diegooglin@gmail.com"
      LOG_FILE: "/data/access.log"
      DUCKDNS_TOKEN: "YOUR_DUCKDNS_TOKEN_HERE"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-config:/config
      - ./caddy-data:/data
